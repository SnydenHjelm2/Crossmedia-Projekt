<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Augusts Dator</title>
    <script src="d3.v7.min.js"></script>
    <link rel="icon" href="images/microsoft.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="lockscreen">
        <h1></h1>
        <h3></h3>
    </div>
    <div class="cover" id="log-in">
        <div id="profile-pic">
            <img src="images/user.png">
        </div>
        <h2>August Stridh</h2>
        <p id="status">Skriv ditt lösenord</p>
        <input id="pwd" type="password" placeholder="Lösenord...">
        <a href="#"><p>Glömt lösenord?</p></a>
        <a id="back" href="#"><p>← Tillbaka</p></a>
    </div>
    <div class="cover" id="loading">
        <img src="images/loading.gif">
        <h2>Loggar in...</h2>
    </div>
    <div id="desktop">
        <div id="desktop-icons">
            <div class="desktop-icon">
                <img src="images/recycle-bin.png">
                <p>Papperskorg</p>
            </div>
            <div class="desktop-icon clickable">
                <img src="images/images.png">
                <p>Bilder</p>
            </div>
            <div class="desktop-icon">
                <img src="images/folder.png">
                <p>jobb</p>
            </div>
            <div class="desktop-icon">
                <img src="images/teams.png">
                <p>Teams</p>
            </div>
            <div class="desktop-icon clickable">
                <img src="images/folder.png">
                <p>bunker</p>
            </div>
        </div>
    </div>
    <div id="desktop-windows" class="cover">
        <div id="bilder" class="desktop-window">
            <div class="top-bar">
                <div>
                    <img src="images/images.png">
                    <p>Bilder</p>
                </div>
                <button class="close">X</button>
            </div>
            <div class="body">
                <div class="body-icon">
                    <img src="images/image.png">
                    <p>IMG_0359.png</p>
                </div>
                <div class="body-icon">
                    <img src="images/image.png">
                    <p>IMG_0365.png</p>
                </div>
                <div class="body-icon">
                    <img src="images/image.png">
                    <p>IMG_0589.png</p>
                </div>
                <div class="body-icon">
                    <img src="images/image.png">
                    <p>IMG_4390.png</p>
                </div>
                <div class="body-icon">
                    <img src="images/image.png">
                    <p>IMG_4391.png</p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
