<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="phone">
        <input type="text" id="phoneNumber" placeholder="Enter number" readonly>

        <div class="keypad">
            <button class="key keyNum">1</button>
            <button class="key keyNum">2</button>
            <button class="key keyNum">3</button>
            <button class="key keyNum">4</button>
            <button class="key keyNum">5</button>
            <button class="key keyNum">6</button>
            <button class="key keyNum">7</button>
            <button class="key keyNum">8</button>
            <button class="key keyNum">9</button>
            <button class="key keyNum">*</button>
            <button class="key keyNum">0</button>
            <button class="key keyNum">#</button>
            <button id="back" class="key">Back</button>
            <button id="call" class="key">Call</button>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
